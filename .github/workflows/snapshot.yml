name: snapshot
on: { schedule: [{cron: '17 */6 * * *'}], workflow_dispatch: {} }
permissions: { contents: write, issues: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/snapshot.mjs | tee out.json
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          # Commit snapshot diffs plus data/status.json (last-checked time) every successful run -> one Vercel redeploy per run (~4/day).
          git add snapshots data/status.json && git diff --cached --quiet || (git commit -m "snapshot $(date -u +%FT%H:%MZ)" && git pull --rebase && git push)
