name: snapshot
on: { schedule: [{cron: '17 */6 * * *'}], workflow_dispatch: {} }
permissions: { contents: write, issues: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/snapshot.mjs | tee out.json
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add snapshots && git diff --cached --quiet || (git commit -m "snapshot $(date -u +%F)" && git push)
